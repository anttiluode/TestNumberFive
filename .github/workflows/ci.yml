name: Reproduce Test Number Five
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate toy physics
        run: python -m unittest discover -s tests -v
      - name: Validate browser / NumPy parity
        run: node tests/browser_parity.mjs
      - name: Rerun preregistered gates
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python -m src.experiment
      - name: Check registered outcomes are preserved
        run: |
          python - <<'PY'
          import json
          r=json.load(open('results/gates.json'))
          assert r['gates']=={'G1':True,'G2':False,'G3':True,'G4':True,'G5':True}
          assert r['setup']['n_test']==160
          PY
      - name: Exploratory mode sensitivity
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python -m src.mode_shifts
